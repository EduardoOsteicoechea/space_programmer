<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>space_programmer</title>
  <style>
    :root { --bg: #0e1116; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, #1a2430 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 80%, #1c1812 0%, transparent 50%),
        var(--bg);
    }

    .stage {
      position: relative;
      width: min(98vw, 1400px);
      height: 96vh;
      overflow: hidden;
      background: #14181e;
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const stage = document.getElementById("stage");

    const OVAL = { cx: 500, cy: 370, rx: 490, ry: 350 };
    const HOLE = { cx: OVAL.cx, cy: OVAL.cy, r: 56 };
    const RING_W = 44;
    const KEEP_OUT = HOLE.r + RING_W;
    const VISIBLE_MIN = 0.50;

    const HALL_REF = 56;
    const CELL = 4;          // rooms per block edge
    const H_BANDS = 3;       // left/right of central V
    const V_BANDS = 3;       // above/below of central H
    const SEC_H = H_BANDS - 1;
    const SEC_V = V_BANDS - 1;

    const hall = { cx: OVAL.cx, cy: OVAL.cy, tx: OVAL.cx, ty: OVAL.cy };
    const QUAD_HUE = { nw: 210, ne: 48, sw: 38, se: 280 };
    const QUADS = ["nw", "ne", "sw", "se"];
    const HALL_COLOR = "rgb(78, 88, 102)";

    const roomDefs = [];
    for (const q of QUADS) {
      for (let hb = 0; hb < H_BANDS; hb++) {
        for (let vb = 0; vb < V_BANDS; vb++) {
          for (let gj = 0; gj < CELL; gj++) {
            for (let gi = 0; gi < CELL; gi++) {
              const i = ((hb * V_BANDS + vb) * CELL + gj) * CELL + gi;
              roomDefs.push({
                id: `${q}-h${hb}-v${vb}-${gi}-${gj}`,
                name: `${q.toUpperCase()} ${i + 1}`,
                q, hb, vb, gi, gj,
                hue: (QUAD_HUE[q] + i * 5 + hb * 28 + vb * 18) % 360,
              });
            }
          }
        }
      }
    }

    const rooms = roomDefs.map((d) => ({
      ...d,
      bx: 0, by: 0, bw: 0, bh: 0,
      x: 0, y: 0, w: 0, h: 0,
      lx: 0, ly: 0, lw: 0, lh: 0,
      prox: 0, visibleFrac: 1, hidden: false, absorbIds: [],
    }));
    const byId = Object.fromEntries(rooms.map((r) => [r.id, r]));

    let fillers = [];
    let hallPockets = [];
    let hueShift = 0;
    let dpr = 1, W = 0, H = 0, metrics = null;

    function resize() {
      const rect = stage.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = rect.width;
      H = rect.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      metrics = computeMetrics();
      layoutFromHall(true);
    }

    function toPx(nx, ny) { return { x: (nx / 1000) * W, y: (ny / 740) * H }; }
    function pxScale() { return { sx: W / 1000, sy: H / 740 }; }

    function computeMetrics() {
      const { sx, sy } = pxScale();
      const hallPx = HALL_REF * ((sx + sy) / 2);
      const roomPx = hallPx * 1.5;
      return {
        sx, sy, hallPx, roomPx,
        vW: hallPx / sx, hH: hallPx / sy,
        rW: roomPx / sx, rH: roomPx / sy,
      };
    }

    function inOval(x, y) {
      const dx = (x - OVAL.cx) / OVAL.rx;
      const dy = (y - OVAL.cy) / OVAL.ry;
      return dx * dx + dy * dy <= 1;
    }
    function inCircularHall(x, y) {
      const dx = x - HOLE.cx, dy = y - HOLE.cy;
      return dx * dx + dy * dy < KEEP_OUT * KEEP_OUT;
    }
    function isVisiblePoint(x, y) {
      return inOval(x, y) && !inCircularHall(x, y);
    }
    function visibleFraction(x, y, w, h) {
      const N = 10;
      let hit = 0;
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
          if (isVisiblePoint(x + (i + 0.5) * (w / N), y + (j + 0.5) * (h / N))) hit++;
        }
      }
      return hit / (N * N);
    }

    function hallBounds() {
      const m = metrics ? metrics.vW + metrics.rW * 2 : 120;
      return {
        minX: OVAL.cx - OVAL.rx + m,
        maxX: OVAL.cx + OVAL.rx - m,
        minY: OVAL.cy - OVAL.ry + m,
        maxY: OVAL.cy + OVAL.ry - m,
      };
    }

    /**
     * Central cross + secondary V halls (L/R) + secondary H halls (top/bottom).
     * Pattern each axis: center | 4 rooms | hall | 4 rooms | hall | 4 rooms
     */
    function hallLayout(cx, cy) {
      const { vW, hH, rW, rH } = metrics;
      const bandW = CELL * rW;
      const bandH = CELL * rH;

      const hallL = cx - vW / 2;
      const hallR = cx + vW / 2;
      const hallT = cy - hH / 2;
      const hallB = cy + hH / 2;

      const leftSecs = [], rightSecs = [], topSecs = [], botSecs = [];
      let lCur = hallL, rCur = hallR, tCur = hallT, bCur = hallB;

      for (let i = 0; i < SEC_H; i++) {
        lCur -= bandW;
        leftSecs.push({ L: lCur - vW, R: lCur });
        lCur -= vW;
        rCur += bandW;
        rightSecs.push({ L: rCur, R: rCur + vW });
        rCur += vW;
      }
      for (let i = 0; i < SEC_V; i++) {
        tCur -= bandH;
        topSecs.push({ T: tCur - hH, B: tCur });
        tCur -= hH;
        bCur += bandH;
        botSecs.push({ T: bCur, B: bCur + hH });
        bCur += hH;
      }

      return {
        hallL, hallR, hallT, hallB, vW, hH, rW, rH,
        leftSecs, rightSecs, topSecs, botSecs,
        hLeft: hallL - H_BANDS * bandW - SEC_H * vW,
        hRight: hallR + H_BANDS * bandW + SEC_H * vW,
        vTop: hallT - V_BANDS * bandH - SEC_V * hH,
        vBottom: hallB + V_BANDS * bandH + SEC_V * hH,
      };
    }

    function cellRect(L, q, hb, vb, gi, gj) {
      const { rW, rH, hallL, hallR, hallT, hallB, leftSecs, rightSecs, topSecs, botSecs } = L;
      let x, y;

      // Horizontal placement
      if (q === "nw" || q === "sw") {
        x = hb === 0 ? hallL - (gi + 1) * rW : leftSecs[hb - 1].L - (gi + 1) * rW;
      } else {
        x = hb === 0 ? hallR + gi * rW : rightSecs[hb - 1].R + gi * rW;
      }

      // Vertical placement
      if (q === "nw" || q === "ne") {
        y = vb === 0 ? hallT - (gj + 1) * rH : topSecs[vb - 1].T - (gj + 1) * rH;
      } else {
        y = vb === 0 ? hallB + gj * rH : botSecs[vb - 1].B + gj * rH;
      }

      return { x, y, w: rW, h: rH };
    }

    function hashStr(s) {
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function neighborsOf(room) {
      const out = [];
      for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const gi = room.gi + di, gj = room.gj + dj;
        if (gi < 0 || gi >= CELL || gj < 0 || gj >= CELL) continue;
        const id = `${room.q}-h${room.hb}-v${room.vb}-${gi}-${gj}`;
        if (byId[id]) out.push(byId[id]);
      }
      return out;
    }

    function unionRect(a, b) {
      const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
      const r = Math.max(a.x + a.w, b.x + b.w), btm = Math.max(a.y + a.h, b.y + b.h);
      return { x, y, w: r - x, h: btm - y };
    }

    function segmentRect(L, q, hb, vb) {
      let rect = null;
      for (let gj = 0; gj < CELL; gj++) {
        for (let gi = 0; gi < CELL; gi++) {
          const c = cellRect(L, q, hb, vb, gi, gj);
          const piece = { x: c.x, y: c.y, w: c.w, h: c.h };
          rect = rect ? unionRect(rect, piece) : piece;
        }
      }
      return rect;
    }

    function layoutFromHall(snap) {
      if (!metrics) metrics = computeMetrics();
      const L = hallLayout(hall.cx, hall.cy);
      fillers = [];
      hallPockets = [];

      for (const r of rooms) {
        const cell = cellRect(L, r.q, r.hb, r.vb, r.gi, r.gj);
        r.bx = cell.x; r.by = cell.y; r.bw = cell.w; r.bh = cell.h;
        r.absorbIds = [];
        const cx = cell.x + cell.w / 2, cy = cell.y + cell.h / 2;
        r.prox = Math.max(0, 1 - Math.hypot(cx - hall.cx, cy - hall.cy) / 420);
        r.visibleFrac = visibleFraction(r.bx, r.by, r.bw, r.bh);
        r.hidden = r.visibleFrac < VISIBLE_MIN;
      }

      const seed = `${Math.round(hall.cx / 8)}:${Math.round(hall.cy / 8)}`;
      const absorbed = new Set();
      for (const r of rooms) {
        if (!r.hidden) continue;
        const cands = neighborsOf(r).filter((n) => !n.hidden);
        if (!cands.length) continue;
        const pick = cands[hashStr(r.id + "|" + seed) % cands.length];
        pick.absorbIds.push(r.id);
        absorbed.add(r.id);
      }

      for (const r of rooms) {
        if (r.hidden) {
          r.x = r.bx; r.y = r.by; r.w = r.bw; r.h = r.bh;
          continue;
        }
        let rect = { x: r.bx, y: r.by, w: r.bw, h: r.bh };
        for (const id of r.absorbIds) {
          const o = byId[id];
          rect = unionRect(rect, { x: o.bx, y: o.by, w: o.bw, h: o.bh });
        }
        r.x = rect.x; r.y = rect.y; r.w = rect.w; r.h = rect.h;
      }

      for (const q of QUADS) {
        for (let hb = 0; hb < H_BANDS; hb++) {
          for (let vb = 0; vb < V_BANDS; vb++) {
            const segRooms = rooms.filter((r) => r.q === q && r.hb === hb && r.vb === vb);
            const orphans = segRooms.filter((r) => r.hidden && !absorbed.has(r.id));
            if (!orphans.length) continue;

            const visibles = segRooms.filter((r) => !r.hidden);
            let rect;
            if (visibles.length === 0) {
              rect = segmentRect(L, q, hb, vb);
            } else {
              rect = { x: orphans[0].bx, y: orphans[0].by, w: orphans[0].bw, h: orphans[0].bh };
              for (let i = 1; i < orphans.length; i++) {
                const o = orphans[i];
                rect = unionRect(rect, { x: o.bx, y: o.by, w: o.bw, h: o.bh });
              }
            }

            const frac = visibleFraction(rect.x, rect.y, rect.w, rect.h);
            if (frac < VISIBLE_MIN) {
              if (frac > 0.02) hallPockets.push({ x: rect.x, y: rect.y, w: rect.w, h: rect.h });
              continue;
            }

            fillers.push({
              id: `fill-${q}-h${hb}-v${vb}`,
              name: `${q.toUpperCase()} ·`,
              hue: (QUAD_HUE[q] + hb * 30 + vb * 20) % 360,
              x: rect.x, y: rect.y, w: rect.w, h: rect.h,
              lx: rect.x, ly: rect.y, lw: rect.w, lh: rect.h,
              prox: Math.max(...orphans.map((o) => o.prox)),
              hidden: false,
            });
          }
        }
      }

      if (snap) {
        for (const r of rooms) { r.lx = r.x; r.ly = r.y; r.lw = r.w; r.lh = r.h; }
        for (const f of fillers) { f.lx = f.x; f.ly = f.y; f.lw = f.w; f.lh = f.h; }
      }
    }

    stage.addEventListener("pointermove", (e) => {
      const rect = stage.getBoundingClientRect();
      const nx = ((e.clientX - rect.left) / W) * 1000;
      const ny = ((e.clientY - rect.top) / H) * 740;
      const b = hallBounds();
      hall.tx = Math.max(b.minX, Math.min(b.maxX, nx));
      hall.ty = Math.max(b.minY, Math.min(b.maxY, ny));
    });

    function roomsClipPath() {
      const { sx, sy } = pxScale();
      const c = toPx(OVAL.cx, OVAL.cy);
      const hole = toPx(HOLE.cx, HOLE.cy);
      const hs = (sx + sy) / 2;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, OVAL.rx * sx, OVAL.ry * sy, 0, 0, Math.PI * 2);
      ctx.ellipse(hole.x, hole.y, KEEP_OUT * hs, KEEP_OUT * hs, 0, 0, Math.PI * 2, true);
    }

    function roomFill(room, t) {
      const wave = Math.sin(t * 0.008 + room.hue) * 0.5 + 0.5;
      const h = (room.hue + hueShift + room.prox * 30 * wave) % 360;
      return `hsla(${h}, ${50 + room.prox * 25}%, ${34 + room.prox * 14}%, ${0.72 + room.prox * 0.18})`;
    }

    function fillHallRect(x, y, w, h) {
      const p = toPx(x, y);
      const q = toPx(x + w, y + h);
      ctx.fillStyle = HALL_COLOR;
      ctx.fillRect(p.x, p.y, q.x - p.x, q.y - p.y);
    }

    function drawCircularHall() {
      const { sx, sy } = pxScale();
      const hole = toPx(HOLE.cx, HOLE.cy);
      const hs = (sx + sy) / 2;
      ctx.beginPath();
      ctx.arc(hole.x, hole.y, KEEP_OUT * hs, 0, Math.PI * 2);
      ctx.arc(hole.x, hole.y, HOLE.r * hs, 0, Math.PI * 2, true);
      ctx.fillStyle = HALL_COLOR;
      ctx.fill("evenodd");
      ctx.beginPath();
      ctx.arc(hole.x, hole.y, HOLE.r * hs, 0, Math.PI * 2);
      ctx.fillStyle = "#0e1116";
      ctx.fill();
      ctx.strokeStyle = HALL_COLOR;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawHallPockets() {
      if (!hallPockets.length) return;
      ctx.save();
      roomsClipPath();
      ctx.clip("evenodd");
      ctx.fillStyle = HALL_COLOR;
      for (const p of hallPockets) {
        const tl = toPx(p.x, p.y);
        const br = toPx(p.x + p.w, p.y + p.h);
        ctx.fillRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
      }
      ctx.restore();
    }

    function drawHalls() {
      const L = hallLayout(hall.cx, hall.cy);
      const { sx, sy } = pxScale();
      const c = toPx(OVAL.cx, OVAL.cy);
      const hole = toPx(HOLE.cx, HOLE.cy);
      const hs = (sx + sy) / 2;

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, OVAL.rx * sx, OVAL.ry * sy, 0, 0, Math.PI * 2);
      ctx.clip();

      // Full horizontal corridors: central + secondary top/bottom
      fillHallRect(L.hLeft, L.hallT, L.hRight - L.hLeft, L.hH);
      for (const s of L.topSecs) fillHallRect(L.hLeft, s.T, L.hRight - L.hLeft, L.hH);
      for (const s of L.botSecs) fillHallRect(L.hLeft, s.T, L.hRight - L.hLeft, L.hH);

      // Full vertical corridors: central + secondary left/right
      const vH = L.vBottom - L.vTop;
      fillHallRect(L.hallL, L.vTop, L.vW, vH);
      for (const s of L.leftSecs) fillHallRect(s.L, L.vTop, L.vW, vH);
      for (const s of L.rightSecs) fillHallRect(s.L, L.vTop, L.vW, vH);

      const hc = toPx(hall.cx, hall.cy);
      ctx.beginPath();
      ctx.arc(hc.x, hc.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#c8d2dc";
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(hole.x, hole.y, HOLE.r * hs, 0, Math.PI * 2);
      ctx.fillStyle = "#0e1116";
      ctx.fill();
    }

    function drawRoomClipped(room, t) {
      if (room.hidden) return;
      const tl = toPx(room.lx, room.ly);
      const br = toPx(room.lx + room.lw, room.ly + room.lh);
      const rw = br.x - tl.x, rh = br.y - tl.y;
      const label = toPx(room.lx + room.lw / 2, room.ly + room.lh / 2);

      ctx.save();
      roomsClipPath();
      ctx.clip("evenodd");
      ctx.fillStyle = roomFill(room, t);
      ctx.fillRect(tl.x, tl.y, rw, rh);
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 1;
      ctx.strokeRect(tl.x, tl.y, rw, rh);
      if (Math.min(rw, rh) > 42) {
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        ctx.font = `500 ${Math.max(7, Math.min(10, Math.min(rw, rh) * 0.1))}px "Segoe UI", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(room.name, label.x, label.y);
      }
      ctx.restore();
    }

    function update(t) {
      hall.cx = hall.tx;
      hall.cy = hall.ty;
      hueShift = (hueShift + 0.12) % 360;
      layoutFromHall(false);
      for (const r of rooms) { r.lx = r.x; r.ly = r.y; r.lw = r.w; r.lh = r.h; }
      for (const f of fillers) { f.lx = f.x; f.ly = f.y; f.lw = f.w; f.lh = f.h; }
    }

    function frame(t) {
      if (!metrics) metrics = computeMetrics();
      update(t);
      ctx.clearRect(0, 0, W, H);
      drawHalls();
      drawCircularHall();
      drawHallPockets();
      const sorted = [...rooms].sort((a, b) => a.prox - b.prox);
      for (const room of sorted) drawRoomClipped(room, t);
      for (const f of fillers) drawRoomClipped(f, t);
      drawCircularHall();
      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
