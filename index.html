<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>space_programmer — mall proportions</title>
  <style>
    :root { --bg: #0e1116; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      height: 100%;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, #1a2430 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 80%, #1c1812 0%, transparent 50%),
        var(--bg);
    }

    .shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      align-items: stretch;
    }

    .side-panel {
      flex: 0 0 auto;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 10px;
      border-radius: 0;
      background: rgba(8, 10, 14, 0.96);
      border: none;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      color: #c8d2dc;
    }

    .legend-panel {
      width: 168px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .panel-footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      line-height: 1.4;
      color: #8a96a5;
    }

    .legend-block {
      flex: 0 0 auto;
    }

    .room-creator {
      flex: 0 0 auto;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .room-creator label {
      display: block;
      margin: 8px 0 4px;
      font-size: 12px;
      color: #8a96a5;
    }

    .room-creator select,
    .room-creator input {
      width: 100%;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #1a2028;
      color: #e8edf3;
      font-size: 12px;
      font-family: inherit;
    }

    .room-creator button {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      border: none;
      border-radius: 4px;
      background: #3d6b9e;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .room-creator button:hover { background: #4a7cb3; }
    .room-creator button.active { background: #c45c26; }
    .room-creator .hint {
      margin-top: 8px;
      font-size: 11px;
      color: #8a96a5;
      line-height: 1.35;
    }

    .stage.placing { cursor: copy; }
    .stage.placing-drag { cursor: grabbing; }
    .stage.hall-drag { cursor: grabbing; }

    .sections-panel {
      width: 220px;
      border-right: none;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
    }

    .side-panel h2 {
      margin: 0 0 10px;
      color: #eef2f6;
      font-size: 14px;
      font-weight: 600;
    }

    .legend-items {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 20px;
    }

    .legend-swatch {
      flex: 0 0 14px;
      width: 14px;
      height: 14px;
      border-radius: 2px;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .legend-label {
      font-size: 14px;
      color: #e8edf3;
      line-height: 1.2;
    }

    .section-block {
      margin-bottom: 14px;
    }

    .section-block:last-child { margin-bottom: 0; }

    .section-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #eef2f6;
    }

    .store-list {
      list-style: none;
      margin: 0;
      padding: 0 0 0 22px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .store-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
      font-size: 12px;
      line-height: 1.3;
    }

    .store-name {
      color: #b8c2ce;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .store-stats {
      flex: 0 0 auto;
      color: #8a96a5;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .sections-total {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: #8a96a5;
    }

    .stage {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      overflow: hidden;
      background: #14181e;
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 900px) {
      .shell {
        flex-direction: column;
        height: 100vh;
      }
      .legend-panel, .sections-panel {
        width: 100%;
        height: auto;
        max-height: 140px;
        flex: 0 0 auto;
        border-left: none;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .sections-panel {
        border-bottom: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        order: 3;
      }
      .stage {
        flex: 1 1 auto;
        order: 2;
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side-panel legend-panel">
      <div class="legend-block" id="legend"></div>
      <div class="room-creator" id="room-creator">
        <h2>Nueva tienda</h2>
        <label for="creator-q">Universo</label>
        <select id="creator-q"></select>
        <label for="creator-tier">Tipo</label>
        <select id="creator-tier">
          <option value="anchor">Ancla (4 celdas)</option>
          <option value="primary">Primaria (2 celdas)</option>
          <option value="standard" selected>Estándar (1 celda)</option>
          <option value="specialty">Especialidad (1 celda)</option>
        </select>
        <label for="creator-name">Nombre</label>
        <input id="creator-name" type="text" placeholder="Ej. 101 Muebles" maxlength="24" />
        <button type="button" id="creator-btn">Crear</button>
        <p class="hint" id="creator-hint">Selecciona tipo y pulsa Crear, luego arrastra al plano.</p>
      </div>
      <p class="panel-footer">Click + drag mueve pasillos con adaptación dinámica de locales.</p>
    </aside>
    <div class="stage" id="stage">
      <canvas id="c"></canvas>
    </div>
    <aside class="side-panel sections-panel" id="sections"></aside>
  </div>

  <script src="contour-data.js"></script>
  <script src="mall-proportions.js"></script>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const stage = document.getElementById("stage");

    // From AreaContourExport area_1927977 (outer + central island)
    const SPACE = { w: 1000, h: 740 };
    let OUTER = null;
    let ISLAND = null;
    let OUTER_BOUNDS = { minX: 40, maxX: 960, minY: 40, maxY: 700 };
    let pathOuterPx = null, pathIslandPx = null, pathRingPx = null;
    // Uniform scale + letterbox offsets (preserves contour proportions)
    let view = { ox: 0, oy: 0, s: 1 };

    const HALL_REF = 56 * 0.75; // hall thickness; rooms = 1.5× this
    const CELL = 4;
    const H_BANDS = 3;
    const V_BANDS = 3;
    const SEC_H = H_BANDS - 1;
    const SEC_V = V_BANDS - 1;

    const MALL = window.MALL_PROPORTIONS;
    const TIERS = MALL.tiers;

    const hall = { cx: 499, cy: 313, tx: 499, ty: 313 };
    const QUADS = ["nw", "ne", "sw", "se"];
    const HALL_COLOR = "rgb(78, 88, 102)";
    const FLOOR_W_M = 112.442;
    const FLOOR_H_M = 86.076;
    const M2_SCALE = (FLOOR_W_M / SPACE.w) * (FLOOR_H_M / SPACE.h);

    function tierLightness(tier) {
      if (tier === "anchor") return 36;
      if (tier === "primary") return 42;
      if (tier === "standard") return 48;
      if (tier === "specialty") return 54;
      return 58;
    }

    function buildRoomDefs() {
      const roomDefs = [];
      for (const q of QUADS) {
        const u = MALL.quadrants[q];
        for (let hb = 0; hb < H_BANDS; hb++) {
          for (let vb = 0; vb < V_BANDS; vb++) {
            for (let gj = 0; gj < CELL; gj++) {
              for (let gi = 0; gi < CELL; gi++) {
                const i = ((hb * V_BANDS + vb) * CELL + gj) * CELL + gi;
                const name = u.sections[gj][gi];
                const tier = u.tiers[gj][gi];
                roomDefs.push({
                  id: `${q}-h${hb}-v${vb}-${gi}-${gj}`,
                  name,
                  q, hb, vb, gi, gj,
                  tier,
                  universe: u.id,
                  baseHue: u.hue,
                });
              }
            }
          }
        }
      }
      return roomDefs;
    }

    const roomDefs = buildRoomDefs();

    const rooms = roomDefs.map((d) => ({
      ...d,
      bx: 0, by: 0, bw: 0, bh: 0,
      x: 0, y: 0, w: 0, h: 0,
      lx: 0, ly: 0, lw: 0, lh: 0,
      prox: 0, visibleFrac: 1, hidden: false, absorbIds: [],
    }));
    const byId = Object.fromEntries(rooms.map((r) => [r.id, r]));

    let fillers = [];
    let hallPockets = [];
    let customRooms = [];
    let suppressedIds = new Set();
    let placement = null;
    let hallDrag = false;
    let customSeq = 0;
    let dpr = 1, W = 0, H = 0, metrics = null;

    const TIER_CELLS = { anchor: 4, primary: 2, standard: 1, specialty: 1 };

    function resize() {
      const rect = stage.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = rect.width;
      H = rect.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // Contain: one scale for X and Y so the contour is never stretched
      const s = Math.min(W / SPACE.w, H / SPACE.h);
      view = {
        s,
        ox: (W - SPACE.w * s) / 2,
        oy: (H - SPACE.h * s) / 2,
      };
      metrics = computeMetrics();
      buildPixelPaths();
      if (OUTER) layoutFromHall(true);
    }

    function toPx(nx, ny) {
      return { x: view.ox + nx * view.s, y: view.oy + ny * view.s };
    }
    function pxScale() {
      return { sx: view.s, sy: view.s };
    }

    function computeMetrics() {
      const { sx, sy } = pxScale();
      const hallPx = HALL_REF * sx;
      const roomPx = hallPx * 1.5;
      return {
        sx, sy, hallPx, roomPx,
        vW: hallPx / sx, hH: hallPx / sy,
        rW: roomPx / sx, rH: roomPx / sy,
      };
    }

    function pointInPoly(x, y, poly) {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const xi = poly[i][0], yi = poly[i][1];
        const xj = poly[j][0], yj = poly[j][1];
        if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / ((yj - yi) || 1e-12) + xi) inside = !inside;
      }
      return inside;
    }

    function buildPixelPaths() {
      if (!OUTER || !ISLAND || !W || !view.s) return;
      const { ox, oy, s } = view;
      function addPoly(path, poly) {
        path.moveTo(ox + poly[0][0] * s, oy + poly[0][1] * s);
        for (let i = 1; i < poly.length; i++) {
          path.lineTo(ox + poly[i][0] * s, oy + poly[i][1] * s);
        }
        path.closePath();
      }
      pathOuterPx = new Path2D(); addPoly(pathOuterPx, OUTER);
      pathIslandPx = new Path2D(); addPoly(pathIslandPx, ISLAND);
      pathRingPx = new Path2D(); addPoly(pathRingPx, OUTER); addPoly(pathRingPx, ISLAND);
    }

    function inOuter(x, y) { return OUTER ? pointInPoly(x, y, OUTER) : false; }
    function inIsland(x, y) { return ISLAND ? pointInPoly(x, y, ISLAND) : false; }
    function isVisiblePoint(x, y) { return inOuter(x, y) && !inIsland(x, y); }
    function visibleFraction(x, y, w, h) {
      const N = 10;
      let hit = 0;
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
          if (isVisiblePoint(x + (i + 0.5) * (w / N), y + (j + 0.5) * (h / N))) hit++;
        }
      }
      return hit / (N * N);
    }

    /** True if rect touches outer contour or central island (any sample not fully safe). */
    function touchesContour(x, y, w, h) {
      const pts = [
        [x, y], [x + w, y], [x, y + h], [x + w, y + h],
        [x + w / 2, y], [x + w / 2, y + h], [x, y + h / 2], [x + w, y + h / 2],
        [x + w / 2, y + h / 2],
      ];
      for (const [px, py] of pts) {
        if (!isVisiblePoint(px, py)) return true;
      }
      // denser edge check along borders
      for (let i = 0; i <= 8; i++) {
        const t = i / 8;
        if (!isVisiblePoint(x + t * w, y)) return true;
        if (!isVisiblePoint(x + t * w, y + h)) return true;
        if (!isVisiblePoint(x, y + t * h)) return true;
        if (!isVisiblePoint(x + w, y + t * h)) return true;
      }
      return false;
    }

    /** Screen-space neighbor priority: right → left → up → down. */
    function preferredNeighbor(room) {
      const q = room.q;
      const tryId = (gi, gj) => {
        if (gi < 0 || gi >= CELL || gj < 0 || gj >= CELL) return null;
        return byId[`${q}-h${room.hb}-v${room.vb}-${gi}-${gj}`] || null;
      };

      // right (higher x)
      const right = (q === "nw" || q === "sw")
        ? tryId(room.gi - 1, room.gj)
        : tryId(room.gi + 1, room.gj);
      // left (lower x)
      const left = (q === "nw" || q === "sw")
        ? tryId(room.gi + 1, room.gj)
        : tryId(room.gi - 1, room.gj);
      // up (lower y)
      const up = (q === "nw" || q === "ne")
        ? tryId(room.gi, room.gj + 1)
        : tryId(room.gi, room.gj - 1);
      // down (higher y)
      const down = (q === "nw" || q === "ne")
        ? tryId(room.gi, room.gj - 1)
        : tryId(room.gi, room.gj + 1);

      for (const n of [right, left, up, down]) {
        if (n && !n.hidden) return n;
      }
      return null;
    }

    function hallBounds() {
      const m = metrics ? metrics.vW + metrics.rW * 2 : 120;
      return {
        minX: OUTER_BOUNDS.minX + m,
        maxX: OUTER_BOUNDS.maxX - m,
        minY: OUTER_BOUNDS.minY + m,
        maxY: OUTER_BOUNDS.maxY - m,
      };
    }

    /**
     * Central cross + secondary V halls (L/R) + secondary H halls (top/bottom).
     * Pattern each axis: center | 4 rooms | hall | 4 rooms | hall | 4 rooms
     */
    function hallLayout(cx, cy) {
      const { vW, hH, rW, rH } = metrics;
      const bandW = CELL * rW;
      const bandH = CELL * rH;

      const hallL = cx - vW / 2;
      const hallR = cx + vW / 2;
      const hallT = cy - hH / 2;
      const hallB = cy + hH / 2;

      const leftSecs = [], rightSecs = [], topSecs = [], botSecs = [];
      let lCur = hallL, rCur = hallR, tCur = hallT, bCur = hallB;

      for (let i = 0; i < SEC_H; i++) {
        lCur -= bandW;
        leftSecs.push({ L: lCur - vW, R: lCur });
        lCur -= vW;
        rCur += bandW;
        rightSecs.push({ L: rCur, R: rCur + vW });
        rCur += vW;
      }
      for (let i = 0; i < SEC_V; i++) {
        tCur -= bandH;
        topSecs.push({ T: tCur - hH, B: tCur });
        tCur -= hH;
        bCur += bandH;
        botSecs.push({ T: bCur, B: bCur + hH });
        bCur += hH;
      }

      return {
        hallL, hallR, hallT, hallB, vW, hH, rW, rH,
        leftSecs, rightSecs, topSecs, botSecs,
        hLeft: hallL - H_BANDS * bandW - SEC_H * vW,
        hRight: hallR + H_BANDS * bandW + SEC_H * vW,
        vTop: hallT - V_BANDS * bandH - SEC_V * hH,
        vBottom: hallB + V_BANDS * bandH + SEC_V * hH,
      };
    }

    function gridWeights(q) {
      const u = MALL.quadrants[q];
      return { cols: u.cols, rows: u.rows };
    }

    function weightedSpan(weights, index, totalUnits, unitPx) {
      const sum = weights.reduce((s, w) => s + w, 0);
      const scale = (totalUnits * unitPx) / sum;
      let offset = 0;
      for (let i = 0; i < index; i++) offset += weights[i] * scale;
      return { offset, size: weights[index] * scale };
    }

    function segmentOrigin(L, q, hb, vb) {
      const { rW, rH, hallL, hallR, hallT, hallB, leftSecs, rightSecs, topSecs, botSecs } = L;
      const bandW = CELL * rW;
      const bandH = CELL * rH;
      let ox, oy;

      if (q === "nw" || q === "sw") {
        ox = hb === 0 ? hallL - bandW : leftSecs[hb - 1].L - bandW;
      } else {
        ox = hb === 0 ? hallR : rightSecs[hb - 1].R;
      }

      if (q === "nw" || q === "ne") {
        oy = vb === 0 ? hallT - bandH : topSecs[vb - 1].T - bandH;
      } else {
        oy = vb === 0 ? hallB : botSecs[vb - 1].B;
      }
      return { ox, oy, bandW, bandH };
    }

    function cellRect(L, q, hb, vb, gi, gj) {
      const { rW, rH } = L;
      const { cols, rows } = gridWeights(q);
      const { ox, oy, bandW, bandH } = segmentOrigin(L, q, hb, vb);
      const col = weightedSpan(cols, gi, CELL, rW);
      const row = weightedSpan(rows, gj, CELL, rH);

      let x = ox + col.offset;
      let y = oy + row.offset;
      if (q === "nw" || q === "sw") x = ox + (bandW - col.offset - col.size);
      if (q === "nw" || q === "ne") y = oy + (bandH - row.offset - row.size);

      return { x, y, w: col.size, h: row.size };
    }

    function hashStr(s) {
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function neighborsOf(room) {
      // kept for compatibility — prefer preferredNeighbor
      const out = [];
      for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const gi = room.gi + di, gj = room.gj + dj;
        if (gi < 0 || gi >= CELL || gj < 0 || gj >= CELL) continue;
        const id = `${room.q}-h${room.hb}-v${room.vb}-${gi}-${gj}`;
        if (byId[id]) out.push(byId[id]);
      }
      return out;
    }

    function unionRect(a, b) {
      const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
      const r = Math.max(a.x + a.w, b.x + b.w), btm = Math.max(a.y + a.h, b.y + b.h);
      return { x, y, w: r - x, h: btm - y };
    }

    function segmentRect(L, q, hb, vb) {
      let rect = null;
      for (let gj = 0; gj < CELL; gj++) {
        for (let gi = 0; gi < CELL; gi++) {
          const c = cellRect(L, q, hb, vb, gi, gj);
          const piece = { x: c.x, y: c.y, w: c.w, h: c.h };
          rect = rect ? unionRect(rect, piece) : piece;
        }
      }
      return rect;
    }

    function expandCluster(start, count) {
      if (!start) return [];
      const queue = [start];
      const seen = new Set([start.id]);
      const out = [start];
      while (out.length < count && queue.length) {
        const cur = queue.shift();
        for (const n of neighborsOf(cur)) {
          if (n.q !== start.q || n.hb !== start.hb || n.vb !== start.vb) continue;
          if (seen.has(n.id) || suppressedIds.has(n.id)) continue;
          seen.add(n.id);
          out.push(n);
          queue.push(n);
          if (out.length >= count) break;
        }
      }
      return out;
    }

    function findCellAt(nx, ny) {
      for (const r of rooms) {
        if (suppressedIds.has(r.id)) continue;
        if (nx >= r.bx && nx <= r.bx + r.bw && ny >= r.by && ny <= r.by + r.bh) return r;
      }
      return null;
    }

    function clusterRect(cluster) {
      let rect = null;
      for (const r of cluster) {
        const piece = { x: r.bx, y: r.by, w: r.bw, h: r.bh };
        rect = rect ? unionRect(rect, piece) : piece;
      }
      return rect;
    }

    function previewCluster(nx, ny, tier) {
      const start = findCellAt(nx, ny);
      if (!start || !isVisiblePoint(nx, ny)) return null;
      const cluster = expandCluster(start, TIER_CELLS[tier] || 1);
      const rect = clusterRect(cluster);
      if (visibleFraction(rect.x, rect.y, rect.w, rect.h) < 0.01) return null;
      return { cluster, rect };
    }

    function placeCustomRoom(nx, ny, spec) {
      const prev = previewCluster(nx, ny, spec.tier);
      if (!prev) return false;
      for (const r of prev.cluster) suppressedIds.add(r.id);
      customSeq += 1;
      customRooms.push({
        id: `custom-${customSeq}`,
        name: spec.name || `Nueva ${customSeq}`,
        q: spec.q,
        tier: spec.tier,
        baseHue: spec.baseHue,
        clusterIds: prev.cluster.map((r) => r.id),
        x: prev.rect.x, y: prev.rect.y, w: prev.rect.w, h: prev.rect.h,
        lx: prev.rect.x, ly: prev.rect.y, lw: prev.rect.w, lh: prev.rect.h,
        hidden: false,
        isCustom: true,
        prox: 1,
      });
      return true;
    }

    function layoutFromHall(snap) {
      if (!metrics) metrics = computeMetrics();
      const L = hallLayout(hall.cx, hall.cy);
      fillers = [];
      hallPockets = [];

      for (const r of rooms) {
        const cell = cellRect(L, r.q, r.hb, r.vb, r.gi, r.gj);
        r.bx = cell.x; r.by = cell.y; r.bw = cell.w; r.bh = cell.h;
        r.absorbIds = [];
        const cx = cell.x + cell.w / 2, cy = cell.y + cell.h / 2;
        r.prox = Math.max(0, 1 - Math.hypot(cx - hall.cx, cy - hall.cy) / 420);
        r.hidden = suppressedIds.has(r.id) || touchesContour(r.bx, r.by, r.bw, r.bh);
      }

      // Hidden → grow right, else left, else up, else down
      const absorbed = new Set();
      for (const r of rooms) {
        if (!r.hidden) continue;
        if (suppressedIds.has(r.id)) continue;
        const pick = preferredNeighbor(r);
        if (!pick) continue;
        pick.absorbIds.push(r.id);
        absorbed.add(r.id);
      }

      for (const r of rooms) {
        if (r.hidden) {
          r.x = r.bx; r.y = r.by; r.w = r.bw; r.h = r.bh;
          continue;
        }
        let rect = { x: r.bx, y: r.by, w: r.bw, h: r.bh };
        for (const id of r.absorbIds) {
          const o = byId[id];
          rect = unionRect(rect, { x: o.bx, y: o.by, w: o.bw, h: o.bh });
        }
        r.x = rect.x; r.y = rect.y; r.w = rect.w; r.h = rect.h;
      }

      // No neighbor → room occupying the whole corner/segment
      for (const q of QUADS) {
        for (let hb = 0; hb < H_BANDS; hb++) {
          for (let vb = 0; vb < V_BANDS; vb++) {
            const segRooms = rooms.filter((r) => r.q === q && r.hb === hb && r.vb === vb);
            const orphans = segRooms.filter((r) => r.hidden && !absorbed.has(r.id));
            if (!orphans.length) continue;

            const visibles = segRooms.filter((r) => !r.hidden);
            let rect;
            if (visibles.length === 0) {
              rect = segmentRect(L, q, hb, vb);
            } else {
              rect = { x: orphans[0].bx, y: orphans[0].by, w: orphans[0].bw, h: orphans[0].bh };
              for (let i = 1; i < orphans.length; i++) {
                const o = orphans[i];
                rect = unionRect(rect, { x: o.bx, y: o.by, w: o.bw, h: o.bh });
              }
            }

            // Always create the corner room (clipped by overflow)
            const anyVisible = visibleFraction(rect.x, rect.y, rect.w, rect.h) > 0.01;
            if (!anyVisible) {
              hallPockets.push({ x: rect.x, y: rect.y, w: rect.w, h: rect.h });
              continue;
            }

            fillers.push({
              id: `fill-${q}-h${hb}-v${vb}`,
              name: `${MALL.quadrants[q].label} ·`,
              q,
              baseHue: MALL.quadrants[q].hue,
              tier: "standard",
              x: rect.x, y: rect.y, w: rect.w, h: rect.h,
              lx: rect.x, ly: rect.y, lw: rect.w, lh: rect.h,
              prox: Math.max(...orphans.map((o) => o.prox)),
              hidden: false,
            });
          }
        }
      }

      if (snap) {
        for (const r of rooms) { r.lx = r.x; r.ly = r.y; r.lw = r.w; r.lh = r.h; }
        for (const f of fillers) { f.lx = f.x; f.ly = f.y; f.lw = f.w; f.lh = f.h; }
      }
      refreshCustomRoomRects();
      for (const c of customRooms) {
        c.lx = c.x; c.ly = c.y; c.lw = c.w; c.lh = c.h;
      }
    }

    function refreshCustomRoomRects() {
      for (const c of customRooms) {
        const cells = c.clusterIds.map((id) => byId[id]).filter(Boolean);
        if (!cells.length) continue;
        const rect = clusterRect(cells);
        c.x = rect.x; c.y = rect.y; c.w = rect.w; c.h = rect.h;
      }
    }

    function pointerNorm(e) {
      const rect = stage.getBoundingClientRect();
      return {
        nx: (e.clientX - rect.left - view.ox) / view.s,
        ny: (e.clientY - rect.top - view.oy) / view.s,
      };
    }

    function clampHall(nx, ny) {
      const b = hallBounds();
      hall.tx = Math.max(b.minX, Math.min(b.maxX, nx));
      hall.ty = Math.max(b.minY, Math.min(b.maxY, ny));
    }

    stage.addEventListener("pointerdown", (e) => {
      const { nx, ny } = pointerNorm(e);
      if (placement) {
        placement.dragging = true;
        placement.nx = nx;
        placement.ny = ny;
        stage.setPointerCapture(e.pointerId);
        stage.classList.add("placing-drag");
        return;
      }
      hallDrag = true;
      clampHall(nx, ny);
      stage.setPointerCapture(e.pointerId);
      stage.classList.add("hall-drag");
    });

    stage.addEventListener("pointermove", (e) => {
      const { nx, ny } = pointerNorm(e);
      if (placement) {
        if (!placement.dragging) return;
        placement.nx = nx;
        placement.ny = ny;
        return;
      }
      if (!hallDrag) return;
      clampHall(nx, ny);
    });

    function endPointer(e) {
      if (placement?.dragging) {
        const ok = placeCustomRoom(placement.nx, placement.ny, placement.spec);
        if (ok) {
          placement = null;
          stage.classList.remove("placing");
          document.getElementById("creator-btn").classList.remove("active");
          document.getElementById("creator-btn").textContent = "Crear";
          document.getElementById("creator-hint").textContent = "Selecciona tipo y pulsa Crear, luego arrastra al plano.";
        } else if (placement) {
          placement.dragging = false;
        }
      }
      hallDrag = false;
      stage.classList.remove("placing-drag", "hall-drag");
      try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
    }

    stage.addEventListener("pointerup", endPointer);
    stage.addEventListener("pointercancel", endPointer);

    function clipToContourRing() {
      if (!pathRingPx) return false;
      ctx.clip(pathRingPx, "evenodd");
      return true;
    }

    function storeColor(baseHue, tier) {
      const l = tierLightness(tier);
      return `hsla(${baseHue + (l - 42)}, 52%, ${l}%, 0.88)`;
    }

    function roomFill(room) {
      return storeColor(room.baseHue ?? room.hue ?? 0, room.tier || "standard");
    }

    function fillHallRect(x, y, w, h) {
      const p = toPx(x, y);
      const q = toPx(x + w, y + h);
      ctx.fillStyle = HALL_COLOR;
      ctx.fillRect(p.x, p.y, q.x - p.x, q.y - p.y);
    }

    function drawContourShell() {
      if (!pathOuterPx || !pathIslandPx) return;
      ctx.fillStyle = "rgba(255,255,255,0.04)";
      ctx.fill(pathOuterPx);
      ctx.fillStyle = HALL_COLOR;
      ctx.fill(pathIslandPx);
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 2;
      ctx.stroke(pathOuterPx);
      ctx.strokeStyle = HALL_COLOR;
      ctx.lineWidth = 2;
      ctx.stroke(pathIslandPx);
    }

    function drawHallPockets() {
      if (!hallPockets.length || !pathRingPx) return;
      ctx.save();
      ctx.clip(pathRingPx, "evenodd");
      ctx.fillStyle = HALL_COLOR;
      for (const p of hallPockets) {
        const tl = toPx(p.x, p.y);
        const br = toPx(p.x + p.w, p.y + p.h);
        ctx.fillRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
      }
      ctx.restore();
    }

    function drawHalls() {
      if (!pathRingPx) return;
      const L = hallLayout(hall.cx, hall.cy);

      ctx.save();
      ctx.clip(pathRingPx, "evenodd");

      fillHallRect(L.hLeft, L.hallT, L.hRight - L.hLeft, L.hH);
      for (const s of L.topSecs) fillHallRect(L.hLeft, s.T, L.hRight - L.hLeft, L.hH);
      for (const s of L.botSecs) fillHallRect(L.hLeft, s.T, L.hRight - L.hLeft, L.hH);

      const vH = L.vBottom - L.vTop;
      fillHallRect(L.hallL, L.vTop, L.vW, vH);
      for (const s of L.leftSecs) fillHallRect(s.L, L.vTop, L.vW, vH);
      for (const s of L.rightSecs) fillHallRect(s.L, L.vTop, L.vW, vH);

      const hc = toPx(hall.cx, hall.cy);
      ctx.beginPath();
      ctx.arc(hc.x, hc.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#c8d2dc";
      ctx.fill();
      ctx.restore();
    }

    function drawRoomClipped(room, t) {
      if (room.hidden) return;
      const tl = toPx(room.lx, room.ly);
      const br = toPx(room.lx + room.lw, room.ly + room.lh);
      const rw = br.x - tl.x, rh = br.y - tl.y;
      const label = toPx(room.lx + room.lw / 2, room.ly + room.lh / 2);

      ctx.save();
      if (!pathRingPx) { ctx.restore(); return; }
      ctx.clip(pathRingPx, "evenodd");
      ctx.fillStyle = roomFill(room);
      ctx.fillRect(tl.x, tl.y, rw, rh);
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 1;
      ctx.strokeRect(tl.x, tl.y, rw, rh);
      if (Math.min(rw, rh) > 28) {
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        const fs = Math.max(6, Math.min(9, Math.min(rw, rh) * 0.11));
        ctx.font = `500 ${fs}px "Segoe UI", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(room.name, label.x, label.y);
      }
      ctx.restore();
    }

    function drawPlacementGhost() {
      const prev = previewCluster(placement.nx, placement.ny, placement.spec.tier);
      if (!prev) return;
      const tl = toPx(prev.rect.x, prev.rect.y);
      const br = toPx(prev.rect.x + prev.rect.w, prev.rect.y + prev.rect.h);
      ctx.save();
      ctx.fillStyle = storeColor(placement.spec.baseHue, placement.spec.tier).replace("0.88", "0.45");
      ctx.fillRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
      ctx.restore();
    }

    function update(t) {
      hall.cx = hall.tx;
      hall.cy = hall.ty;
      layoutFromHall(false);
      for (const r of rooms) { r.lx = r.x; r.ly = r.y; r.lw = r.w; r.lh = r.h; }
      for (const f of fillers) { f.lx = f.x; f.ly = f.y; f.lw = f.w; f.lh = f.h; }
      renderSectionsPanel();
    }

    function frame(t) {
      if (!OUTER) { requestAnimationFrame(frame); return; }
      if (!metrics) metrics = computeMetrics();
      update(t);
      ctx.clearRect(0, 0, W, H);
      drawContourShell();
      drawHalls();
      drawHallPockets();
      const sorted = [...rooms].sort((a, b) => a.prox - b.prox);
      for (const room of sorted) drawRoomClipped(room, t);
      for (const f of fillers) drawRoomClipped(f, t);
      for (const c of customRooms) drawRoomClipped(c, t);
      if (placement?.dragging) drawPlacementGhost();
      // Island on top so hall arms don't paint over it
      if (pathIslandPx) {
        ctx.fillStyle = HALL_COLOR;
        ctx.fill(pathIslandPx);
        ctx.strokeStyle = HALL_COLOR;
        ctx.lineWidth = 2;
        ctx.stroke(pathIslandPx);
      }
      if (pathOuterPx) {
        ctx.strokeStyle = "rgba(255,255,255,0.4)";
        ctx.lineWidth = 2;
        ctx.stroke(pathOuterPx);
      }
      requestAnimationFrame(frame);
    }

    function normAreaToM2(w, h) {
      return w * h * M2_SCALE;
    }

    function collectStoreAreas() {
      const bySection = {};
      for (const q of QUADS) {
        const u = MALL.quadrants[q];
        bySection[q] = { label: u.label, baseHue: u.hue, stores: new Map() };
      }

      function add(room) {
        if (room.hidden || !room.w || !room.h) return;
        const sec = bySection[room.q];
        const a = normAreaToM2(room.w, room.h);
        sec.stores.set(room.name, (sec.stores.get(room.name) || 0) + a);
      }

      for (const r of rooms) add(r);
      for (const f of fillers) add(f);
      for (const c of customRooms) add(c);

      let total = 0;
      for (const q of QUADS) {
        for (const a of bySection[q].stores.values()) total += a;
      }
      return { bySection, total };
    }

    function renderSectionsPanel() {
      const el = document.getElementById("sections");
      const { bySection, total } = collectStoreAreas();
      const blocks = QUADS.map((q) => {
        const sec = bySection[q];
        const rows = [...sec.stores.entries()]
          .sort((a, b) => b[1] - a[1])
          .map(([name, area]) => {
            const pct = total > 0 ? (area / total) * 100 : 0;
            return `<li class="store-row">
              <span class="store-name" title="${name}">${name}</span>
              <span class="store-stats">${area.toFixed(0)} m² · ${pct.toFixed(1)}%</span>
            </li>`;
          }).join("");
        const secTotal = [...sec.stores.values()].reduce((s, a) => s + a, 0);
        const secPct = total > 0 ? (secTotal / total) * 100 : 0;
        return `<div class="section-block">
          <div class="section-head">
            <span class="legend-swatch" style="background:${storeColor(sec.baseHue, "standard")}"></span>
            <span>${sec.label}</span>
          </div>
          <ul class="store-list">${rows}</ul>
          <div class="store-stats" style="padding-left:22px;margin-top:4px">${secTotal.toFixed(0)} m² · ${secPct.toFixed(1)}%</div>
        </div>`;
      }).join("");

      el.innerHTML = `
        <h2>Secciones</h2>
        ${blocks}
        <div class="sections-total">Total tiendas: ${total.toFixed(0)} m²</div>`;
    }

    function renderLegend() {
      const el = document.getElementById("legend");
      const items = QUADS.map((q) => {
        const u = MALL.quadrants[q];
        const color = storeColor(u.hue, "standard");
        return `<li class="legend-item">
          <span class="legend-swatch" style="background:${color}"></span>
          <span class="legend-label">${u.label}</span>
        </li>`;
      }).join("");

      const hallItem = `<li class="legend-item">
        <span class="legend-swatch" style="background:${HALL_COLOR}"></span>
        <span class="legend-label">Pasillos e isla central</span>
      </li>`;

      el.innerHTML = `
        <h2>Leyenda</h2>
        <ul class="legend-items">${items}${hallItem}</ul>`;
    }

    function setupRoomCreator() {
      const qSel = document.getElementById("creator-q");
      qSel.innerHTML = QUADS.map((q) => {
        const u = MALL.quadrants[q];
        return `<option value="${q}">${u.label}</option>`;
      }).join("");

      document.getElementById("creator-btn").addEventListener("click", () => {
        if (placement) {
          placement = null;
          stage.classList.remove("placing", "placing-drag");
          document.getElementById("creator-btn").classList.remove("active");
          document.getElementById("creator-btn").textContent = "Crear";
          document.getElementById("creator-hint").textContent = "Selecciona tipo y pulsa Crear, luego arrastra al plano.";
          return;
        }
        const q = qSel.value;
        const tier = document.getElementById("creator-tier").value;
        const name = document.getElementById("creator-name").value.trim()
          || `Nueva · ${MALL.quadrants[q].label}`;
        placement = {
          spec: { q, tier, name, baseHue: MALL.quadrants[q].hue },
          nx: hall.cx, ny: hall.cy, dragging: false,
        };
        stage.classList.add("placing");
        const btn = document.getElementById("creator-btn");
        btn.classList.add("active");
        btn.textContent = "Cancelar";
        document.getElementById("creator-hint").textContent = "Arrastra al plano y suelta. Las celdas se adaptan al tamaño.";
      });
    }

    async function boot() {
      const data = window.CONTOUR_DATA || await fetch("contour.json").then((r) => r.json());
      OUTER = data.outer;
      ISLAND = data.island;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const [x, y] of OUTER) {
        if (x < minX) minX = x; if (y < minY) minY = y;
        if (x > maxX) maxX = x; if (y > maxY) maxY = y;
      }
      OUTER_BOUNDS = { minX, minY, maxX, maxY };
      const icx = ISLAND.reduce((s, p) => s + p[0], 0) / ISLAND.length;
      const icy = ISLAND.reduce((s, p) => s + p[1], 0) / ISLAND.length;
      hall.cx = hall.tx = icx;
      hall.cy = hall.ty = icy;
      renderLegend();
      setupRoomCreator();
      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(frame);
    }

    boot();
  </script>
</body>
</html>
