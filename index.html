<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>space_programmer</title>
  <style>
    :root { --bg: #0e1116; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, #1a2430 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 80%, #1c1812 0%, transparent 50%),
        var(--bg);
    }

    .stage {
      position: relative;
      width: min(98vw, 1400px);
      height: 96vh;
      overflow: hidden;
      background: #14181e;
      cursor: crosshair;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const stage = document.getElementById("stage");

    const OVAL = { cx: 500, cy: 370, rx: 490, ry: 350 };
    const HOLE = { cx: OVAL.cx, cy: OVAL.cy, r: 56 };
    const RING_W = 44;
    const KEEP_OUT = HOLE.r + RING_W;
    const VISIBLE_MIN = 0.75;

    const HALL_REF = 56;
    const ROOMS_PER_BAND = 4;
    const ROWS = 4;
    const BANDS = 3;
    const SEC_HALLS = BANDS - 1;

    const hall = {
      cx: OVAL.cx,
      cy: OVAL.cy,
      tx: OVAL.cx,
      ty: OVAL.cy,
    };

    const QUAD_HUE = { nw: 210, ne: 48, sw: 38, se: 280 };
    const QUADS = ["nw", "ne", "sw", "se"];

    const roomDefs = [];
    for (const q of QUADS) {
      for (let band = 0; band < BANDS; band++) {
        for (let gj = 0; gj < ROWS; gj++) {
          for (let gi = 0; gi < ROOMS_PER_BAND; gi++) {
            const i = band * ROOMS_PER_BAND * ROWS + gj * ROOMS_PER_BAND + gi;
            roomDefs.push({
              id: `${q}-b${band}-${gi}-${gj}`,
              name: `${q.toUpperCase()} ${i + 1}`,
              q, band, gi, gj,
              hue: (QUAD_HUE[q] + i * 6 + band * 35) % 360,
            });
          }
        }
      }
    }

    const rooms = roomDefs.map((d) => ({
      ...d,
      bx: 0, by: 0, bw: 0, bh: 0,
      x: 0, y: 0, w: 0, h: 0,
      lx: 0, ly: 0, lw: 0, lh: 0,
      prox: 0,
      visibleFrac: 1,
      hidden: false,
      absorbIds: [],
    }));

    const byId = Object.fromEntries(rooms.map((r) => [r.id, r]));
    /** Synthetic rooms that fill a whole segment when no neighbor can absorb. */
    let fillers = [];
    /** Hall-colored pads for corner voids (can't place a room against the circle). */
    let hallPockets = [];

    const HALL_COLOR = "rgb(78, 88, 102)";

    let hueShift = 0;
    let dpr = 1;
    let W = 0, H = 0;
    let metrics = null;

    function resize() {
      const rect = stage.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = rect.width;
      H = rect.height;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      metrics = computeMetrics();
      layoutFromHall(true);
    }

    function toPx(nx, ny) {
      return { x: (nx / 1000) * W, y: (ny / 740) * H };
    }

    function pxScale() {
      return { sx: W / 1000, sy: H / 740 };
    }

    function computeMetrics() {
      const { sx, sy } = pxScale();
      const hallPx = HALL_REF * ((sx + sy) / 2);
      const roomPx = hallPx * 1.5;
      return {
        sx, sy, hallPx, roomPx,
        vW: hallPx / sx,
        hH: hallPx / sy,
        rW: roomPx / sx,
        rH: roomPx / sy,
      };
    }

    function inOval(x, y) {
      const dx = (x - OVAL.cx) / OVAL.rx;
      const dy = (y - OVAL.cy) / OVAL.ry;
      return dx * dx + dy * dy <= 1;
    }

    function inCircularHall(x, y) {
      const dx = x - HOLE.cx;
      const dy = y - HOLE.cy;
      return dx * dx + dy * dy < KEEP_OUT * KEEP_OUT;
    }

    function isVisiblePoint(x, y) {
      return inOval(x, y) && !inCircularHall(x, y);
    }

    function visibleFraction(x, y, w, h) {
      const N = 10;
      let hit = 0;
      for (let i = 0; i < N; i++) {
        for (let j = 0; j < N; j++) {
          if (isVisiblePoint(x + (i + 0.5) * (w / N), y + (j + 0.5) * (h / N))) hit++;
        }
      }
      return hit / (N * N);
    }

    function hallBounds() {
      const m = metrics ? metrics.vW + metrics.rW * 2 : 120;
      return {
        minX: OVAL.cx - OVAL.rx + m,
        maxX: OVAL.cx + OVAL.rx - m,
        minY: OVAL.cy - OVAL.ry + m,
        maxY: OVAL.cy + OVAL.ry - m,
      };
    }

    function hallLayout(cx, cy) {
      const { vW, hH, rW, rH } = metrics;
      const bandSpan = ROOMS_PER_BAND * rW;
      const rowSpan = ROWS * rH;

      const hallL = cx - vW / 2;
      const hallR = cx + vW / 2;
      const hallT = cy - hH / 2;
      const hallB = cy + hH / 2;

      const leftSecs = [];
      const rightSecs = [];

      let leftCursor = hallL;
      let rightCursor = hallR;
      for (let i = 0; i < SEC_HALLS; i++) {
        leftCursor -= bandSpan;
        leftSecs.push({ L: leftCursor - vW, R: leftCursor });
        leftCursor -= vW;

        rightCursor += bandSpan;
        rightSecs.push({ L: rightCursor, R: rightCursor + vW });
        rightCursor += vW;
      }

      return {
        hallL, hallR, hallT, hallB, vW, hH, rW, rH,
        leftSecs, rightSecs,
        hLeft: hallL - BANDS * bandSpan - SEC_HALLS * vW,
        hRight: hallR + BANDS * bandSpan + SEC_HALLS * vW,
        // Vertical corridors through all rows above/below
        vTop: hallT - rowSpan,
        vBottom: hallB + rowSpan,
      };
    }

    function cellRect(L, q, band, gi, gj) {
      const { rW, rH, hallL, hallR, hallT, hallB, leftSecs, rightSecs } = L;
      let x, y;

      if (q === "nw" || q === "ne") y = hallT - (gj + 1) * rH;
      else y = hallB + gj * rH;

      if (q === "nw" || q === "sw") {
        if (band === 0) x = hallL - (gi + 1) * rW;
        else x = leftSecs[band - 1].L - (gi + 1) * rW;
      } else {
        if (band === 0) x = hallR + gi * rW;
        else x = rightSecs[band - 1].R + gi * rW;
      }

      return { x, y, w: rW, h: rH };
    }

    function hashStr(s) {
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    /** Contiguous neighbors in the same room block (same q + band). */
    function neighborsOf(room) {
      const out = [];
      const deltas = [
        [1, 0], [-1, 0], [0, 1], [0, -1],
      ];
      for (const [di, dj] of deltas) {
        const gi = room.gi + di;
        const gj = room.gj + dj;
        if (gi < 0 || gi >= ROOMS_PER_BAND || gj < 0 || gj >= ROWS) continue;
        const id = `${room.q}-b${room.band}-${gi}-${gj}`;
        if (byId[id]) out.push(byId[id]);
      }
      return out;
    }

    function unionRect(a, b) {
      const x = Math.min(a.x, b.x);
      const y = Math.min(a.y, b.y);
      const r = Math.max(a.x + a.w, b.x + b.w);
      const btm = Math.max(a.y + a.h, b.y + b.h);
      return { x, y, w: r - x, h: btm - y };
    }

    /** Full rectangle of a (quad, band) block between halls. */
    function segmentRect(L, q, band) {
      let rect = null;
      for (let gj = 0; gj < ROWS; gj++) {
        for (let gi = 0; gi < ROOMS_PER_BAND; gi++) {
          const c = cellRect(L, q, band, gi, gj);
          const piece = { x: c.x, y: c.y, w: c.w, h: c.h };
          rect = rect ? unionRect(rect, piece) : piece;
        }
      }
      return rect;
    }

    function layoutFromHall(snap) {
      if (!metrics) metrics = computeMetrics();
      const L = hallLayout(hall.cx, hall.cy);
      fillers = [];
      hallPockets = [];

      for (const r of rooms) {
        const cell = cellRect(L, r.q, r.band, r.gi, r.gj);
        r.bx = cell.x; r.by = cell.y; r.bw = cell.w; r.bh = cell.h;
        r.absorbIds = [];
        const cx = cell.x + cell.w / 2;
        const cy = cell.y + cell.h / 2;
        r.prox = Math.max(0, 1 - Math.hypot(cx - hall.cx, cy - hall.cy) / 400);
        r.visibleFrac = visibleFraction(r.bx, r.by, r.bw, r.bh);
        r.hidden = r.visibleFrac < VISIBLE_MIN;
      }

      const seed = `${Math.round(hall.cx / 8)}:${Math.round(hall.cy / 8)}`;
      const absorbed = new Set();
      for (const r of rooms) {
        if (!r.hidden) continue;
        const cands = neighborsOf(r).filter((n) => !n.hidden);
        if (!cands.length) continue;
        const pick = cands[hashStr(r.id + "|" + seed) % cands.length];
        pick.absorbIds.push(r.id);
        absorbed.add(r.id);
      }

      for (const r of rooms) {
        if (r.hidden) {
          r.x = r.bx; r.y = r.by; r.w = r.bw; r.h = r.bh;
          continue;
        }
        let rect = { x: r.bx, y: r.by, w: r.bw, h: r.bh };
        for (const id of r.absorbIds) {
          const o = byId[id];
          rect = unionRect(rect, { x: o.bx, y: o.by, w: o.bw, h: o.bh });
        }
        r.x = rect.x; r.y = rect.y; r.w = rect.w; r.h = rect.h;
      }

      for (const q of QUADS) {
        for (let band = 0; band < BANDS; band++) {
          const segRooms = rooms.filter((r) => r.q === q && r.band === band);
          const orphans = segRooms.filter((r) => r.hidden && !absorbed.has(r.id));
          if (!orphans.length) continue;

          const visibles = segRooms.filter((r) => !r.hidden);
          let rect;
          if (visibles.length === 0) {
            rect = segmentRect(L, q, band);
          } else {
            rect = { x: orphans[0].bx, y: orphans[0].by, w: orphans[0].bw, h: orphans[0].bh };
            for (let i = 1; i < orphans.length; i++) {
              const o = orphans[i];
              rect = unionRect(rect, { x: o.bx, y: o.by, w: o.bw, h: o.bh });
            }
          }

          const frac = visibleFraction(rect.x, rect.y, rect.w, rect.h);
          if (frac < VISIBLE_MIN) {
            // Corner void between circle and halls — fill with hall color
            if (frac > 0.02) {
              hallPockets.push({ x: rect.x, y: rect.y, w: rect.w, h: rect.h });
            }
            continue;
          }

          fillers.push({
            id: `fill-${q}-b${band}`,
            name: `${q.toUpperCase()} ·`,
            q, band,
            hue: (QUAD_HUE[q] + band * 40 + 15) % 360,
            x: rect.x, y: rect.y, w: rect.w, h: rect.h,
            lx: rect.x, ly: rect.y, lw: rect.w, lh: rect.h,
            prox: Math.max(...orphans.map((o) => o.prox)),
            hidden: false,
          });
        }
      }

      if (snap) {
        for (const r of rooms) {
          r.lx = r.x; r.ly = r.y; r.lw = r.w; r.lh = r.h;
        }
        for (const f of fillers) {
          f.lx = f.x; f.ly = f.y; f.lw = f.w; f.lh = f.h;
        }
      }
    }

    stage.addEventListener("pointermove", (e) => {
      const rect = stage.getBoundingClientRect();
      const nx = ((e.clientX - rect.left) / W) * 1000;
      const ny = ((e.clientY - rect.top) / H) * 740;
      const b = hallBounds();
      hall.tx = Math.max(b.minX, Math.min(b.maxX, nx));
      hall.ty = Math.max(b.minY, Math.min(b.maxY, ny));
    });

    function roomsClipPath() {
      const { sx, sy } = pxScale();
      const c = toPx(OVAL.cx, OVAL.cy);
      const hole = toPx(HOLE.cx, HOLE.cy);
      const hs = (sx + sy) / 2;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, OVAL.rx * sx, OVAL.ry * sy, 0, 0, Math.PI * 2);
      ctx.ellipse(hole.x, hole.y, KEEP_OUT * hs, KEEP_OUT * hs, 0, 0, Math.PI * 2, true);
    }

    function roomFill(room, t) {
      const wave = Math.sin(t * 0.008 + room.hue) * 0.5 + 0.5;
      const h = (room.hue + hueShift + room.prox * 30 * wave) % 360;
      return `hsla(${h}, ${50 + room.prox * 25}%, ${34 + room.prox * 14}%, ${0.72 + room.prox * 0.18})`;
    }

    function fillHallRect(x, y, w, h) {
      const p = toPx(x, y);
      const q = toPx(x + w, y + h);
      ctx.fillStyle = HALL_COLOR;
      ctx.fillRect(p.x, p.y, q.x - p.x, q.y - p.y);
    }

    function drawCircularHall() {
      const { sx, sy } = pxScale();
      const hole = toPx(HOLE.cx, HOLE.cy);
      const hs = (sx + sy) / 2;

      ctx.beginPath();
      ctx.arc(hole.x, hole.y, KEEP_OUT * hs, 0, Math.PI * 2);
      ctx.arc(hole.x, hole.y, HOLE.r * hs, 0, Math.PI * 2, true);
      ctx.fillStyle = HALL_COLOR;
      ctx.fill("evenodd");

      ctx.beginPath();
      ctx.arc(hole.x, hole.y, HOLE.r * hs, 0, Math.PI * 2);
      ctx.fillStyle = "#0e1116";
      ctx.fill();
      ctx.strokeStyle = HALL_COLOR;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawHallPockets() {
      if (!hallPockets.length) return;
      ctx.save();
      roomsClipPath();
      ctx.clip("evenodd");
      ctx.fillStyle = HALL_COLOR;
      for (const p of hallPockets) {
        const tl = toPx(p.x, p.y);
        const br = toPx(p.x + p.w, p.y + p.h);
        ctx.fillRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);
      }
      ctx.restore();
    }

    function drawHalls() {
      const L = hallLayout(hall.cx, hall.cy);
      const { sx, sy } = pxScale();
      const c = toPx(OVAL.cx, OVAL.cy);
      const hole = toPx(HOLE.cx, HOLE.cy);
      const hs = (sx + sy) / 2;

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, OVAL.rx * sx, OVAL.ry * sy, 0, 0, Math.PI * 2);
      ctx.clip();

      fillHallRect(L.hLeft, L.hallT, L.hRight - L.hLeft, L.hH);
      const vH = L.vBottom - L.vTop;
      fillHallRect(L.hallL, L.vTop, L.vW, vH);
      for (const s of L.leftSecs) fillHallRect(s.L, L.vTop, L.vW, vH);
      for (const s of L.rightSecs) fillHallRect(s.L, L.vTop, L.vW, vH);

      const hc = toPx(hall.cx, hall.cy);
      ctx.beginPath();
      ctx.arc(hc.x, hc.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#c8d2dc";
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(hole.x, hole.y, HOLE.r * hs, 0, Math.PI * 2);
      ctx.fillStyle = "#0e1116";
      ctx.fill();
    }

    function drawRoomClipped(room, t) {
      if (room.hidden) return;

      const tl = toPx(room.lx, room.ly);
      const br = toPx(room.lx + room.lw, room.ly + room.lh);
      const rw = br.x - tl.x;
      const rh = br.y - tl.y;
      const label = toPx(room.lx + room.lw / 2, room.ly + room.lh / 2);

      ctx.save();
      roomsClipPath();
      ctx.clip("evenodd");

      ctx.fillStyle = roomFill(room, t);
      ctx.fillRect(tl.x, tl.y, rw, rh);
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 1;
      ctx.strokeRect(tl.x, tl.y, rw, rh);

      if (Math.min(rw, rh) > 42) {
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        ctx.font = `500 ${Math.max(7, Math.min(10, Math.min(rw, rh) * 0.1))}px "Segoe UI", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(room.name, label.x, label.y);
      }

      ctx.restore();
    }

    function update(t) {
      hall.cx = hall.tx;
      hall.cy = hall.ty;
      hueShift = (hueShift + 0.12) % 360;

      layoutFromHall(false);

      for (const r of rooms) {
        r.lx = r.x; r.ly = r.y; r.lw = r.w; r.lh = r.h;
      }
      for (const f of fillers) {
        f.lx = f.x; f.ly = f.y; f.lw = f.w; f.lh = f.h;
      }
    }

    function frame(t) {
      if (!metrics) metrics = computeMetrics();
      update(t);
      ctx.clearRect(0, 0, W, H);
      drawHalls();
      drawCircularHall();
      drawHallPockets();
      const sorted = [...rooms].sort((a, b) => a.prox - b.prox);
      for (const room of sorted) drawRoomClipped(room, t);
      for (const f of fillers) drawRoomClipped(f, t);
      drawCircularHall();
      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
